name: Nikkei225 EARLY Research

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * 1-5"   # 18:15 JST

permissions:
  contents: write

jobs:
  early:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements_early.txt

      - name: Run EARLY research
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQ_MIN_INTERVAL_SEC: "1.25"
        run: python early_research.py

      - name: Save research data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_early reports_early
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update EARLY research data R2"
            git push
          fi
